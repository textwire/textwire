name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: burn
    name: Build and test
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install line length checker
        run: go install github.com/golangci/golines@latest

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Build
        run: go build -v ./...

      - name: Run cheks
        run: make check
