name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: podman
    container: docker.io/library/node:26
    name: Build and test
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y wget

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: https://github.com/actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install line length checker
        run: go install github.com/golangci/golines@latest

      - name: Install golangci-lint
        run: |
          wget -q https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-arm64.deb
          dpkg -i golangci-lint-2.12.2-linux-arm64.deb

      - name: Build
        run: go build -v ./...

      - name: Run checks
        run: make check
