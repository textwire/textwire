name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Run checks for Go ${{ matrix.go-version }}
    strategy:
      matrix:
        go-version: ["1.25", "1.26", "1.27"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: webgtx/setup-podman-compose@v1

      - name: Pull image
        run: make pull

      - name: Run checks
        run: make
