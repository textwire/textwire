name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: debian13-podman
    name: Run checks for Go ${{ matrix.go-version }}
    strategy:
      matrix:
        go-version: ["1.25", "1.26", "1.27"]

    steps:
      - name: Run checks
        run: make check
